<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <style>
      .tils-italic {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-size: 110px;
        font-weight: 900;
        font-style: italic;
      }
      .condensed-title {
        font-family: 'Impact', 'Arial Black', sans-serif;
        font-size: 58px;
        font-stretch: ultra-condensed;
        transform: scale(0.72, 1.28);
      }
      .banner-text {
        font-family: 'Arial', sans-serif;
        font-size: 9.5px;
        font-weight: 900;
        font-style: italic;
        fill: #ffffff;
      }
      .c-blue { fill: #003882; }
      .c-orange { fill: #f36c21; }
    </style>
  </defs>

  <!-- ==================== LEFT LOGO EMBLEM ==================== -->
  <g id="LogoMark" transform="translate(40, 10)">

    <!-- Dynamic Orange Speed Lines behind TILS -->
    <path d="M 30 54 L 235 48 L 232 60 L 30 60 Z" class="c-orange" />
    <path d="M 80 66 L 228 66 L 226 77 L 80 77 Z" class="c-orange" />
    <path d="M 50 83 L 222 83 L 220 93 L 50 93 Z" class="c-orange" />
    <path d="M 105 99 L 210 99 L 208 107 L 105 107 Z" class="c-orange" />

    <!-- TILS Text Elements -->
    <g class="tils-italic" transform="translate(15, 178)">
      <text x="0" y="0" class="c-blue">T</text>
      <text x="65" y="0" class="c-blue">I</text>
      <text x="110" y="0" class="c-orange">L</text>
      <text x="175" y="0" class="c-blue">S</text>
    </g>

    <!-- Bottom Sub-Banner with Text -->
    <g transform="translate(18, 192)">
      <polygon points="0,0 235,0 230,16 0,16" class="c-blue" />
      <text x="6" y="11.5" class="banner-text">Transport of India Logistics Solution</text>
    </g>

    <!-- Precision Semi-Truck Silhouette (Dark Blue) -->
    <g class="c-blue" transform="translate(20, 0)">
      <!-- Main Cab & Roof Deflector -->
      <path d="M 225 45 
               C 230 44, 258 40, 282 44 
               C 310 49, 348 64, 365 102 
               L 374 122 
               C 386 126, 400 131, 408 140 
               C 414 147, 417 155, 417 172 
               C 417 178, 410 186, 396 186 
               C 378 186, 366 177, 360 162 
               C 353 146, 340 142, 328 152 
               C 315 162, 305 174, 290 178 
               L 282 178 
               C 272 178, 268 174, 268 165 
               C 268 152, 282 144, 292 135 
               C 305 124, 308 105, 306 82 
               C 304 64, 288 56, 266 54 
               C 246 52, 230 49, 225 45 Z" />

      <!-- Roof Fairing Cutout / Visor -->
      <path d="M 245 52 
               C 262 50, 286 52, 298 62 
               C 280 66, 258 64, 245 52 Z" fill="#ffffff" />

      <!-- Windshield -->
      <path d="M 288 72 
               C 300 72, 328 80, 345 105 
               C 348 110, 345 116, 326 116 
               C 308 116, 294 104, 284 94 
               C 278 86, 278 76, 288 72 Z" fill="#ffffff" />

      <!-- Side Window -->
      <polygon points="266,74 278,74 272,112 260,112" fill="#ffffff" />

      <!-- Front Grille Housing -->
      <path d="M 378 142 
               C 386 142, 394 147, 394 157 
               L 394 175 
               C 394 180, 388 182, 380 182 
               C 372 182, 368 178, 368 172 
               L 368 155 
               C 368 146, 372 142, 378 142 Z" fill="#ffffff" />

      <!-- Grille Inset Lines -->
      <rect x="373" y="148" width="16" height="3" class="c-blue" />
      <rect x="373" y="154" width="16" height="3" class="c-blue" />
      <rect x="373" y="160" width="16" height="3" class="c-blue" />
      <rect x="373" y="166" width="16" height="3" class="c-blue" />
      <rect x="373" y="172" width="16" height="3" class="c-blue" />

      <!-- Sweeping Aerodynamic Flare Details -->
      <path d="M 286 146 
               C 305 146, 322 156, 335 174 
               C 346 189, 362 195, 382 195 
               C 362 201, 338 196, 324 178 
               C 314 165, 300 156, 284 154 Z" />

      <path d="M 314 182 
               C 328 196, 346 204, 372 204 
               C 350 209, 330 205, 314 192 Z" />
    </g>
  </g>

  <!-- ==================== RIGHT SIDE TITLE ==================== -->
  <g id="LogoTitle" transform="translate(540, 0)">
    <!-- Line 1: TRANSPORT OF INDIA -->
    <text class="condensed-title c-blue" x="0" y="85">TRANSPORT OF INDIA</text>

    <!-- Line 2: LOGISTICS SOLUTION -->
    <text class="condensed-title" x="0" y="148">
      <tspan class="c-orange">LOGISTICS </tspan>
      <tspan class="c-blue">SOLUTION</tspan>
    </text>
  </g>
</svg>
