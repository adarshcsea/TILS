<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="tilsBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <!-- Orange Gradient -->
    <linearGradient id="tilsOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow Effect -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D9FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= LOGO ICON / SPEED TRUCK EMBLEM ================= -->
  <g transform="translate(10, 10)">
    <!-- Speed Motion Trails -->
    <path d="M 5 22 L 65 22 L 55 30 L 5 30 Z" fill="url(#tilsOrangeGrad)" opacity="0.9" />
    <path d="M 0 34 L 52 34 L 42 42 L 0 42 Z" fill="url(#tilsOrangeGrad)" opacity="0.75" />
    <path d="M 8 46 L 40 46 L 32 54 L 8 54 Z" fill="url(#tilsOrangeGrad)" opacity="0.6" />

    <!-- Aerodynamic Truck Body Outline -->
    <path d="M 68 20 
             C 85 10, 115 12, 130 25 
             C 138 32, 142 42, 145 52
             L 170 55
             C 178 57, 182 65, 180 72
             L 174 88
             C 172 92, 166 95, 160 95
             L 60 95
             C 52 95, 48 90, 48 82
             L 48 30
             Z" 
          fill="none" 
          stroke="#0066FF" 
          stroke-width="5.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Cabin Windshield & Aerodynamic Contours -->
    <path d="M 125 28 
             C 135 34, 142 44, 144 54 
             L 115 54 
             C 112 42, 116 33, 125 28 Z" 
          fill="#00D9FF" 
          opacity="0.85" />

    <!-- Truck Front Bumper Sweep -->
    <path d="M 148 68 
             C 162 68, 172 74, 165 88 
             C 155 86, 145 80, 142 74 Z" 
          fill="#0055FF" />

    <!-- Wheel Arches & Wheels -->
    <circle cx="82" cy="94" r="14" fill="#050816" stroke="#00D9FF" stroke-width="4.5" />
    <circle cx="82" cy="94" r="5" fill="#FFA000" />

    <circle cx="145" cy="94" r="14" fill="#050816" stroke="#00D9FF" stroke-width="4.5" />
    <circle cx="145" cy="94" r="5" fill="#FFA000" />
  </g>

  <!-- ================= TILS ACRONYM TEXT ================= -->
  <g transform="translate(15, 88)">
    <text font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-1">
      <tspan fill="#0066FF">TI</tspan><tspan fill="#FF7A00">LS</tspan>
    </text>
  </g>

  <!-- ================= TYPOGRAPHIC WORDMARK ================= -->
  <g transform="translate(205, 48)">
    <!-- Primary Heading: TRANSPORT OF INDIA -->
    <text x="0" y="0" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="25" 
          font-weight="800" 
          letter-spacing="0.8" 
          fill="#0055D4">
      TRANSPORT OF INDIA
    </text>

    <!-- Subheading: LOGISTICS SOLUTION -->
    <text x="0" y="32" 
          font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="1.2" 
          fill="url(#tilsOrangeGrad)">
      LOGISTICS SOLUTION
    </text>

    <!-- Micro Baseline -->
    <text x="2" y="48" 
          font-family="'Inter', sans-serif" 
          font-size="8.5" 
          font-weight="600" 
          letter-spacing="2.5" 
          fill="#64748B">
      ENTERPRISE FREIGHT &amp; TELEMATICS NETWORK
    </text>
  </g>
</svg>
